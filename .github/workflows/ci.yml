name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, contracts, build, technical SEO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm lint

      - name: Locale and localized route contracts
        run: pnpm test:i18n

      - name: Build
        run: pnpm build

      # Validates the sitemap, robots.txt, redirects, noindex headers and
      # per-page canonicals against the real build output. Deliberately a CI
      # step rather than part of postbuild: it pins per-article dates and
      # required slugs, so running it in postbuild would fail a production
      # deploy whenever content changes without the script being updated too.
      - name: Technical SEO check
        run: pnpm seo:technical:built

      # The brand contract tests read the public Wenlan repository, so no secret
      # is needed: current CLI, MCP and plugin sources from the default branch,
      # and release facts (version.txt, CHANGELOG.md) from the selected tag.
      - name: Check out Wenlan release source
        uses: actions/checkout@v4
        with:
          repository: 7xuanlu/wenlan
          path: .release-source/wenlan

      # fetch-tags on a shallow checkout only follows tags on the fetched commit,
      # and the selected release tag is usually behind the branch tip. Fetching
      # every tag one commit deep avoids cloning the full history.
      - name: Fetch Wenlan release tags
        run: git -C .release-source/wenlan fetch --depth=1 origin '+refs/tags/*:refs/tags/*'

      - name: Brand, release, app, SEO, schema, pipeline contracts
        env:
          WENLAN_REPO_ROOT: ${{ github.workspace }}/.release-source/wenlan
        run: pnpm test:seo
