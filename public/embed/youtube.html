<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Wenlan video player</title>
<style>
html, body { margin: 0; height: 100%; background: #000; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!--
  The Wenlan app plays a saved YouTube link in its card through this page.
  YouTube's embedded player needs a web page address as the referrer, which
  the app's own window does not have. The video id comes after the #, so it
  never reaches this site's server.
-->
<script>
(function () {
  var id = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  var frame = document.createElement("iframe");
  frame.src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0";
  frame.title = "YouTube video player";
  frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  frame.allowFullscreen = true;
  frame.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(frame);
})();
</script>
</body>
</html>
